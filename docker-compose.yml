version: '3.8'
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: silabus-app
        restart: unless-stopped
        volumes:
            - './.env:/var/www/html/.env'
            - 'storage-data:/var/www/html/storage'
        depends_on:
            - db
        networks:
            - silabus-network
    web:
        image: 'nginx:alpine'
        restart: unless-stopped
        ports:
            - '8000:80'
        volumes:
            - './docker/nginx/app.conf:/etc/nginx/conf.d/default.conf'
            - './public:/var/www/html/public'
        depends_on:
            - app
        networks:
            - silabus-network
    db:
        image: 'mariadb:10.11'
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:-silabus_db}'
            MYSQL_USER: '${DB_USERNAME:-silabus_user}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-rootsecret}'
        volumes:
            - 'db-data:/var/lib/mysql'
        networks:
            - silabus-network
    db-backup:
        image: databack/mysql-backup
        restart: unless-stopped
        environment:
            DB_SERVER: db
            DB_USER: '${DB_USERNAME:-silabus_user}'
            DB_PASS: '${DB_PASSWORD:-secret}'
            DB_NAMES: '${DB_DATABASE:-silabus_db}'
            CRON_TIME: '0 2 * * *'
            MAX_BACKUPS: 7
            INIT_BACKUP: 'true'
        volumes:
            - './backups:/db'
        depends_on:
            - db
        networks:
            - silabus-network
    cloudflared:
        image: 'cloudflare/cloudflared:latest'
        restart: unless-stopped
        command: 'tunnel --no-autoupdate run'
        environment:
            - 'TUNNEL_TOKEN=${TUNNEL_TOKEN}'
        networks:
            - silabus-network
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
networks:
    silabus-network:
        driver: bridge
volumes:
    db-data: null
    storage-data: null
    sail-mysql:
        driver: local
